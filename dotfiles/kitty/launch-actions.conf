# Files sent to Kitty by macOS (Finder, file links, open, or the Dock).
protocol file
mime inode/directory
action launch --type=os-window zsh -lic 'exec yazi -- "$@"' kitty-open ${FILE_PATH}

protocol file
mime image/*
action launch --type=os-window kitten icat --hold -- ${FILE_PATH}

# Edit files, including scripts, instead of using Kitty's script execution rules.
# A fallback also covers config files whose MIME type Kitty does not recognize.
protocol file
action launch --type=os-window zsh -lic 'exec "$@"' kitty-open $EDITOR -- ${FILE_PATH}
