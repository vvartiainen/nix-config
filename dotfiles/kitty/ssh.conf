# vim:ft=conf

# Extra bash setup for kitten ssh sessions only. kitty's bash integration reads
# KITTY_BASH_ETC_LOCATION in place of /etc and unsets it right away, so the
# remote ~/.bash* files are untouched and plain ssh logins are unaffected.
copy --symlink-strategy=resolve --dest=.local/share/kitty-ssh-kitten/etc/profile .config/kitty/remote/profile
env KITTY_BASH_ETC_LOCATION=$HOME/.local/share/kitty-ssh-kitten/etc
