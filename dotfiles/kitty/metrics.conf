# Dedicated quick-access view; the normal quick-access shell keeps its config.
edge center-sized
columns 100
lines 28
background_opacity 1
hide_on_focus_loss yes

kitty_override startup_session=none
kitty_override tab_bar_style=hidden
kitty_override font_size=14
kitty_override listen_on=none
kitty_override allow_remote_control=no
kitty_override confirm_os_window_close=0

# Kitty handles dismissal even while the quota subprocess is busy. Local
# remote_control mappings do not require an externally accessible socket.
kitty_override map=esc remote_control resize-os-window --self --action=hide
kitty_override map=q remote_control resize-os-window --self --action=hide
kitty_override map=ctrl+c remote_control resize-os-window --self --action=hide
kitty_override map=cmd+w remote_control resize-os-window --self --action=hide
