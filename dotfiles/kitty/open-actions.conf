# Image files - show in overlay using icat
protocol file
mime image/*
action launch --type=overlay kitten icat --hold -- ${FILE_PATH}

# Log files - tail them in real-time
protocol file
ext log
action launch tail -f -- ${FILE_PATH}
action goto_layout grid

# Directories - open in Yazi with the normal shell environment.
protocol file
mime inode/directory
action launch --type=window zsh -lic 'exec yazi -- "$@"' kitty-open ${FILE_PATH}

# Text files - pass paths as arguments, never interpolate them into shell code.
protocol file
mime text/*
action launch --type=window zsh -lic 'exec "$@"' kitty-open $EDITOR -- ${FILE_PATH}

# Some config and source extensions have application/* or unknown MIME types.
protocol file
ext md,markdown,txt,log,json,jsonc,yaml,yml,toml,ini,conf,cfg,nix,lua,sh,bash,zsh,fish,py,rb,rs,go,js,jsx,ts,tsx,css,scss,html,xml,sql,c,h,cpp,hpp,swift
action launch --type=window zsh -lic 'exec "$@"' kitty-open $EDITOR -- ${FILE_PATH}

# Other files (PDFs, archives, etc.) fall through to the macOS default app.
